name: Test CPAN Module from Repository
run-name: "Test ${{ inputs.repository }}${{ inputs.ref && format('@{0}', inputs.ref) || '' }}"

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'GitHub repository (owner/repo)'
        type: string
        required: true
      ref:
        description: 'Git ref to test (branch, tag, or SHA). Defaults to the repository default branch.'
        type: string
        default: ''
      include-distroprefs:
        description: 'Use CPAN distribution preferences'
        type: boolean
        default: true
      include-sysdeps:
        description: 'Use cpan-sysdeps plugin for system dependencies'
        type: boolean
        default: true
      enable-cpan-reporter:
        description: 'Send test reports to CPAN Testers'
        type: boolean
        default: false
      debug:
        description: 'Enable debug output'
        type: boolean
        default: false
  workflow_call:
    inputs:
      repository:
        description: 'GitHub repository (owner/repo)'
        type: string
        required: true
      ref:
        description: 'Git ref to test (branch, tag, or SHA). Defaults to the repository default branch.'
        type: string
        default: ''
      include-distroprefs:
        description: 'Use CPAN distribution preferences'
        type: boolean
        default: true
      include-sysdeps:
        description: 'Use cpan-sysdeps plugin for system dependencies'
        type: boolean
        default: true
      enable-cpan-reporter:
        description: 'Send test reports to CPAN Testers'
        type: boolean
        default: false
      debug:
        description: 'Enable debug output'
        type: boolean
        default: false

permissions:
  contents: read

env:
  PERL_MM_USE_DEFAULT: 1
  AUTOMATED_TESTING: 1
  NONINTERACTIVE_TESTING: 1

jobs:
  test-module:
    name: on ${{ matrix.container || matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'macos-14'
            container: ~
          - os: 'macos-15'
            container: ~
          - os: 'ubuntu-22.04'
            container: ~
          - os: 'ubuntu-24.04'
            container: ~
          - os: 'ubuntu-latest'
            container: ubuntu:20.04
          - os: 'ubuntu-latest'
            container: ubuntu:24.04
          - os: 'ubuntu-latest'
            container: fedora:38
          - os: 'ubuntu-latest'
            container: fedora:43
          - os: 'ubuntu-latest'
            container: rockylinux:9
          - os: 'ubuntu-latest'
            container: debian:buster
          - os: 'ubuntu-latest'
            container: debian:bullseye
          - os: 'ubuntu-latest'
            container: debian:bookworm
          - os: 'ubuntu-latest'
            container: debian:trixie
          - os: 'ubuntu-latest'
            container: alpine:3.23

    steps:
    - name: Show inputs
      env:
        INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
      run: echo "$INPUTS_JSON"

    - name: "Fix sources.list for archived Debian releases"
      if: startsWith(matrix.container, 'debian')
      run: |
        codename="$(grep VERSION_CODENAME /etc/os-release 2>/dev/null | cut -d= -f2 || true)"
        if [ "$codename" = "buster" ] || [ "$codename" = "stretch" ]; then
          cat > /etc/apt/sources.list <<EOF
        deb http://archive.debian.org/debian $codename main contrib non-free
        deb http://archive.debian.org/debian-security $codename/updates main contrib non-free
        EOF
          rm -f /etc/apt/sources.list.d/*
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until
        fi

    - uses: actions/checkout@v3
      if: matrix.container == 'debian:buster'

    - uses: actions/checkout@v6
      if: matrix.container != 'debian:buster'

    - uses: actions/checkout@v3
      with:
        repository: eserte/ci-helper-cpan-pm
        path: ci-helper-cpan-pm
      if: matrix.container == 'debian:buster'

    - uses: actions/checkout@v6
      with:
        repository: eserte/ci-helper-cpan-pm
        path: ci-helper-cpan-pm
      if: matrix.container != 'debian:buster'

    - name: "Rocky Linux: setup repositories"
      if: startsWith(matrix.container, 'rockylinux')
      run: |
        dnf clean all
        rm -rf /var/cache/yum
        dnf update -y
        dnf install -y dnf-plugins-core
        dnf config-manager --set-enabled crb

    - name: "rpm-based: install perl, git, build tools"
      if: startsWith(matrix.container, 'fedora') || startsWith(matrix.container, 'rockylinux')
      run: |
        dnf -y install "perl(CPAN)" "perl(Test::More)" "perl(Parse::CPAN::Meta)" \
          git make gcc patch glibc-devel

    - name: "apt-based: install perl, git, build tools"
      if: startsWith(matrix.container, 'debian') || startsWith(matrix.container || matrix.os, 'ubuntu')
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudocmd=$( [ "$(id -u)" -ne 0 ] && echo "sudo" || echo "" )
        $sudocmd apt-get update -yq && $sudocmd apt-get install -yqq perl git make gcc g++
        echo "DEBIAN_FRONTEND=noninteractive" >> "$GITHUB_ENV"

    - name: "apk-based: install perl, git, build tools"
      if: startsWith(matrix.container, 'alpine')
      run: apk update -q && apk add -q perl perl-dev perl-utils git build-base wget patch

    - name: "macOS: add Perl site bin to PATH"
      if: startsWith(matrix.os, 'macos')
      run: echo "$(perl -MConfig -e 'print $Config{sitebin}')" >> $GITHUB_PATH

    - name: "apt: remove conflicting packages"
      if: startsWith(matrix.container, 'debian') || startsWith(matrix.container || matrix.os, 'ubuntu')
      run: |
        sudocmd=$( [ "$(id -u)" -ne 0 ] && echo "sudo" || echo "" )
        $sudocmd rm -f /etc/apt/sources.list.d/*.list
        $sudocmd apt-get update -qq
        $sudocmd apt-get remove -y libgd3 nginx 2>/dev/null || true

    - name: Setup CPAN with sysdeps
      run: |
        distroprefs_opts=
        if [ "${{ inputs.include-distroprefs }}" = 'true' ]; then
          distroprefs_opts='--distroprefs=https://github.com/eserte/srezic-cpan-distroprefs'
        fi
        sysdeps_opts=
        if [ "${{ inputs.include-sysdeps }}" = 'true' ]; then
          sysdeps_opts='--enable-sysdeps'
        fi
        cpan_reporter_opts=
        if [ "${{ inputs.enable-cpan-reporter }}" = 'true' ]; then
          cpan_reporter_opts="--enable-cpan-reporter --email-from=${GITHUB_ACTOR}@users.noreply.github.com"
        fi
        debug_opts=
        if [ "${{ inputs.debug }}" = 'true' ]; then
          debug_opts='--debug'
        fi
        set -ex
        $GITHUB_WORKSPACE/ci-helper-cpan-pm/ci-helper-cpan-pm --no-test $distroprefs_opts $sysdeps_opts $cpan_reporter_opts $debug_opts

    - name: Clone target repository
      env:
        INPUT_REF: ${{ inputs.ref }}
        INPUT_REPO: ${{ inputs.repository }}
      run: |
        if [ -n "$INPUT_REF" ]; then
          git clone --branch "$INPUT_REF" --depth=1 "https://github.com/${INPUT_REPO}.git" "$GITHUB_WORKSPACE/target-module" 2>/dev/null \
            || { git clone "https://github.com/${INPUT_REPO}.git" "$GITHUB_WORKSPACE/target-module" && git -C "$GITHUB_WORKSPACE/target-module" checkout "$INPUT_REF"; }
        else
          git clone --depth=1 "https://github.com/${INPUT_REPO}.git" "$GITHUB_WORKSPACE/target-module"
        fi
        cd "$GITHUB_WORKSPACE/target-module"
        echo "Cloned ${INPUT_REPO} at $(git rev-parse --short HEAD) ref=${INPUT_REF:-default}"

    - name: Detect module name
      id: detect
      run: sh $GITHUB_WORKSPACE/scripts/detect-module.sh $GITHUB_WORKSPACE/target-module

    - name: cpan-sysdeps check
      if: inputs.include-sysdeps && steps.detect.outputs.module_name != ''
      continue-on-error: true
      env:
        MODULE_NAME: ${{ steps.detect.outputs.module_name }}
      run: cpan-sysdeps --cpanmod "$MODULE_NAME"

    - name: cpan-sysdeps dry-run
      if: inputs.include-sysdeps && steps.detect.outputs.module_name != ''
      continue-on-error: true
      env:
        MODULE_NAME: ${{ steps.detect.outputs.module_name }}
      run: cpan-sysdeps --cpanmod "$MODULE_NAME" --dry-run

    - name: Install dependencies, build, and test
      run: sh $GITHUB_WORKSPACE/scripts/build-and-test.sh $GITHUB_WORKSPACE/target-module

    - name: Prepare artifact name
      if: always() && inputs.enable-cpan-reporter == true
      id: artifact-name
      shell: sh
      env:
        CONTAINER: ${{ matrix.container }}
        OS: ${{ matrix.os }}
      run: |
        if [ -n "$CONTAINER" ]; then
          NAME="$CONTAINER"
        else
          NAME="$OS"
        fi
        NAME=$(echo "$NAME" | tr ':' '_')
        echo "artifact_name=cpan-test-report-$NAME" >> $GITHUB_OUTPUT

    - name: Upload CPAN test reports
      if: always() && inputs.enable-cpan-reporter == true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.artifact-name.outputs.artifact_name }}
        path: ~/var/cpantesters/new/*.rpt

  test-module-windows:
    name: on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'windows-2022'
          - os: 'windows-2025'

    steps:
    - name: Show inputs
      env:
        INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
      run: echo "$INPUTS_JSON"

    - uses: actions/checkout@v6

    - uses: actions/checkout@v6
      with:
        repository: eserte/ci-helper-cpan-pm
        path: ci-helper-cpan-pm

    - name: Setup CPAN with sysdeps
      run: |
        $distroprefs_opts = ""
        if ("${{ inputs.include-distroprefs }}" -eq "true") {
          $distroprefs_opts = "--distroprefs=https://github.com/eserte/srezic-cpan-distroprefs"
        }
        $sysdeps_opts = ""
        if ("${{ inputs.include-sysdeps }}" -eq "true") {
          $sysdeps_opts = "--enable-sysdeps"
        }
        $cpan_reporter_opts = ""
        if ("${{ inputs.enable-cpan-reporter }}" -eq "true") {
          $cpan_reporter_opts = "--enable-cpan-reporter --email-from=$env:GITHUB_ACTOR@users.noreply.github.com"
        }
        $debug_opts = ""
        if ("${{ inputs.debug }}" -eq "true") {
          $debug_opts = "--debug"
        }
        $ci_helper_cmd = "perl $env:GITHUB_WORKSPACE\ci-helper-cpan-pm\ci-helper-cpan-pm --no-test $distroprefs_opts $sysdeps_opts $cpan_reporter_opts $debug_opts"
        Write-Host $ci_helper_cmd
        Invoke-Expression $ci_helper_cmd

    - name: Prepend Strawberry Perl to PATH
      run: |
        echo "C:\Strawberry\c\bin;C:\Strawberry\perl\site\bin;C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
      shell: powershell

    - name: Fix Perl PATH for bash on Windows
      shell: bash
      run: |
        rm -f /usr/bin/perl /usr/bin/perl.exe 2>/dev/null || true

    - name: Clone target repository
      env:
        INPUT_REF: ${{ inputs.ref }}
        INPUT_REPO: ${{ inputs.repository }}
      run: |
        $ref = $env:INPUT_REF
        if ($ref -ne "") {
          $result = git clone --branch $ref --depth=1 "https://github.com/${env:INPUT_REPO}.git" "$env:GITHUB_WORKSPACE\target-module" 2>&1
          if ($LASTEXITCODE -ne 0) {
            git clone "https://github.com/${env:INPUT_REPO}.git" "$env:GITHUB_WORKSPACE\target-module"
            git -C "$env:GITHUB_WORKSPACE\target-module" checkout $ref
          }
        } else {
          git clone --depth=1 "https://github.com/${env:INPUT_REPO}.git" "$env:GITHUB_WORKSPACE\target-module"
        }

    - name: Detect module name
      id: detect
      shell: bash
      run: bash "$GITHUB_WORKSPACE/scripts/detect-module.sh" "$GITHUB_WORKSPACE/target-module"

    - name: cpan-sysdeps check
      if: inputs.include-sysdeps && steps.detect.outputs.module_name != ''
      continue-on-error: true
      env:
        MODULE_NAME: ${{ steps.detect.outputs.module_name }}
      run: cpan-sysdeps --cpanmod "$MODULE_NAME"

    - name: cpan-sysdeps dry-run
      if: inputs.include-sysdeps && steps.detect.outputs.module_name != ''
      continue-on-error: true
      env:
        MODULE_NAME: ${{ steps.detect.outputs.module_name }}
      run: cpan-sysdeps --cpanmod "$MODULE_NAME" --dry-run

    - name: Install dependencies, build, and test
      shell: bash
      run: bash "$GITHUB_WORKSPACE/scripts/build-and-test.sh" "$GITHUB_WORKSPACE/target-module"

    - name: Prepare artifact path
      if: always() && inputs.enable-cpan-reporter == true
      id: artifact-path
      run: echo "userprofile=$env:USERPROFILE" >> $env:GITHUB_OUTPUT

    - name: Upload CPAN test reports
      if: always() && inputs.enable-cpan-reporter == true
      uses: actions/upload-artifact@v7
      with:
        name: cpan-test-report-${{ matrix.os }}
        path: ${{ steps.artifact-path.outputs.userprofile }}\\var\\cpantesters\\new\\*.rpt

  test-module-bsd:
    name: on ${{ matrix.operating_system }} ${{ matrix.osvers }} ${{ matrix.architecture }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - operating_system: freebsd
            osvers: '15.0'
            architecture: 'x86-64'
          - operating_system: freebsd
            osvers: '14.3'
            architecture: 'x86-64'
          - operating_system: freebsd
            osvers: '13.5'
            architecture: 'x86-64'
          - operating_system: openbsd
            osvers: '7.8'
            architecture: 'x86-64'
          - operating_system: netbsd
            osvers: '10.1'
            architecture: 'x86-64'

    steps:
    - name: Show inputs
      env:
        INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
      run: echo "$INPUTS_JSON"

    - uses: actions/checkout@v6

    - uses: actions/checkout@v6
      with:
        repository: eserte/ci-helper-cpan-pm
        path: ci-helper-cpan-pm

    - uses: cross-platform-actions/action@v1.3.0
      env:
        INPUT_REF: ${{ inputs.ref }}
        INPUT_REPO: ${{ inputs.repository }}
        ACTOR: ${{ github.actor }}
      with:
        operating_system: '${{ matrix.operating_system }}'
        version: '${{ matrix.osvers }}'
        architecture: '${{ matrix.architecture }}'
        memory: 8G
        environment_variables: INPUT_REF INPUT_REPO ACTOR PERL_MM_USE_DEFAULT AUTOMATED_TESTING NONINTERACTIVE_TESTING
        shell: bash
        run: |
          echo "::group::Install system prerequisites"
          has_sysdeps_support=no
          case "${{ matrix.operating_system }}" in
            freebsd)
              sudo env IGNORE_OSVERSION=yes pkg update || echo "::warning::pkg update failed (non-fatal)"
              sudo pkg clean -ay 2>/dev/null || true
              sudo pkg install -y perl5 git
              has_sysdeps_support=yes
              ;;
            openbsd)
              sudo pkg_add -u
              sudo pkg_add perl git
              has_sysdeps_support=yes
              ;;
            netbsd)
              if command -v pkgin >/dev/null 2>&1; then
                sudo pkgin -y update
                sudo pkgin -y install perl git
              else
                sudo pkg_add perl git
              fi
              ;;
          esac
          echo "::endgroup::"

          echo "::group::Setup CPAN environment"
          distroprefs_opts=
          if [ "${{ inputs.include-distroprefs }}" = 'true' ]; then
            distroprefs_opts='--distroprefs=https://github.com/eserte/srezic-cpan-distroprefs'
          fi
          sysdeps_opts=
          if [ "${{ inputs.include-sysdeps }}" = 'true' ] && [ "$has_sysdeps_support" = 'yes' ]; then
            sysdeps_opts='--enable-sysdeps'
          fi
          cpan_reporter_opts=
          if [ "${{ inputs.enable-cpan-reporter }}" = 'true' ]; then
            cpan_reporter_opts="--enable-cpan-reporter --email-from=${ACTOR}@users.noreply.github.com"
          fi
          debug_opts=
          if [ "${{ inputs.debug }}" = 'true' ]; then
            debug_opts='--debug'
          fi
          set -ex
          $GITHUB_WORKSPACE/ci-helper-cpan-pm/ci-helper-cpan-pm --no-test --reports-dir=$HOME/work/var/cpantesters/new $distroprefs_opts $sysdeps_opts $cpan_reporter_opts $debug_opts
          set +x
          echo "::endgroup::"

          echo "::group::Clone target repository"
          if [ -n "$INPUT_REF" ]; then
            git clone --branch "$INPUT_REF" --depth=1 "https://github.com/${INPUT_REPO}.git" "$GITHUB_WORKSPACE/target-module" 2>/dev/null \
              || { git clone "https://github.com/${INPUT_REPO}.git" "$GITHUB_WORKSPACE/target-module" && git -C "$GITHUB_WORKSPACE/target-module" checkout "$INPUT_REF"; }
          else
            git clone --depth=1 "https://github.com/${INPUT_REPO}.git" "$GITHUB_WORKSPACE/target-module"
          fi
          cd "$GITHUB_WORKSPACE/target-module"
          echo "Cloned ${INPUT_REPO} at $(git rev-parse --short HEAD) ref=${INPUT_REF:-default}"
          echo "::endgroup::"

          echo "::group::Detect module and install system deps"
          MODULE_NAME=$(sh $GITHUB_WORKSPACE/scripts/detect-module.sh $GITHUB_WORKSPACE/target-module)

          if [ -n "$MODULE_NAME" ] && [ -n "$sysdeps_opts" ]; then
            set +e
            cpan-sysdeps --cpanmod "$MODULE_NAME" || true
            cpan-sysdeps --cpanmod "$MODULE_NAME" --dry-run || true
            set -e
          fi
          echo "::endgroup::"

          echo "::group::Install dependencies, build, and test"
          sh $GITHUB_WORKSPACE/scripts/build-and-test.sh $GITHUB_WORKSPACE/target-module
          echo "::endgroup::"

    - name: Upload CPAN test reports
      if: always() && inputs.enable-cpan-reporter == true
      uses: actions/upload-artifact@v7
      with:
        name: cpan-test-report-${{ matrix.operating_system }}-${{ matrix.osvers }}-${{ matrix.architecture }}
        path: ~/work/var/cpantesters/new/*.rpt
